title: Unfolio — Legal
description: Privacy Policy and Terms of Service for the Unfolio app.
baseurl: "/unfolio-legal"
url: "https://afekhas7.github.io"

# No theme is set on purpose — _layouts/legal.html is the whole site.
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

kramdown:
  input: GFM
  # The source documents never soft-wrap prose (paragraphs are single long
  # lines), so a newline is always an intentional break — e.g. the
  # Effective date / Last updated / Publisher / Contact header block.
  hard_wrap: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
